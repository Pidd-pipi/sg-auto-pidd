<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>调度日志 · sologsb 调度台</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("sologsb-theme-v3")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}</script>
  <link rel="stylesheet" href="/static/app.css?v=0.4.0">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="brand-text"><b>调度台</b><small>sologsb</small></span>
    </a>
    <nav class="nav">
      <a href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>监看<span class="count" id="navTasks">0</span></a>
      <a href="/tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>队列<span class="count" id="navQueue">0</span></a>
      <a href="/logs" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>日志</a>
      <a href="/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></svg>设置</a>
    </nav>
    <div class="rail-group">
      <label class="rail-label" for="folderSelect">默认文件夹</label>
      <select class="input" id="folderSelect"></select>
      <div class="rail-path" id="folderPath"></div>
      <span class="rail-label">调度模式</span>
      <button class="mode-toggle" id="modeBadge" type="button" data-mode="containers"><span class="dot"></span>容器优先</button>
    </div>
    <div class="rail-foot">
      <div class="rail-foot-row">
        <div class="sync" id="sync"><span class="dot"></span><span id="syncText">连接中</span></div>
        <button class="icon-btn" id="themeBtn" type="button" title="切换明暗主题" aria-label="切换明暗主题">
          <svg class="theme-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="app-version" id="appVersion">v—</div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="head-main"><h2 class="head-title">调度日志</h2><span class="head-meta" id="logMeta"></span></div>
      <div class="head-tools">
        <button class="btn ghost" id="clearBtn" type="button" title="只清空当前页面的视图，不删除日志文件">清空视图</button>
      </div>
    </header>

    <div class="page">
      <section class="table">
        <div class="table-sticky" style="border-bottom:0">
          <div class="toolbar">
            <div class="segmented" id="levelRow">
              <button type="button" data-level="" class="active">全部</button>
              <button type="button" data-level="info">Info</button>
              <button type="button" data-level="warning">Warning</button>
              <button type="button" data-level="error">Error</button>
              <button type="button" data-level="debug">Debug</button>
            </div>
            <label class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input class="input" id="searchInput" type="search" placeholder="搜索事件 / 项目编号 / 详情" autocomplete="off">
            </label>
            <span class="grow"></span>
            <label class="switch" title="有新日志时自动回到顶部（最新在上）"><input type="checkbox" id="followToggle" checked><span class="track"></span>跟随最新</label>
          </div>
          <div class="list-head logrow" style="height:auto;padding-block:8px">
            <span>时间</span><span>级别</span><span>事件</span><span>详情</span>
          </div>
        </div>
        <div class="logtable" id="logTable"></div>
        <div class="empty" id="emptyState" hidden>还没有调度事件。</div>
      </section>
    </div>
  </main>
</div>

<script src="/static/app.js?v=0.4.0"></script>
<script>
  const { $, $$, esc, debounce, fetchJson, postJson, fmtTime, toast,
          initTheme, renderRail, connectStream, renderKeyed, setText, setAttr } = window.SoloApp;

  const state = { entries: [], lastSeq: 0, query: "", level: "", follow: true, connected: false, error: "", snapshot: null };
  initTheme();

  function detailText(entry) {
    return typeof entry.detail === "string" ? entry.detail : JSON.stringify(entry.detail ?? "");
  }

  function matches(entry) {
    if (state.level && String(entry.level || "") !== state.level) return false;
    if (!state.query) return true;
    const hay = [entry.event, entry.projectCode, entry.taskId, detailText(entry)].join(" ").toLowerCase();
    return hay.includes(state.query);
  }

  function renderRow(node, entry) {
    let changed = false;
    changed = setAttr(node, "data-seq", entry.seq) || changed;
    if (node.dataset.built !== "1") {
      node.className = "logrow";
      node.innerHTML = `<span class="ts"></span><span class="lv"></span><span class="ev-name"><span></span><small></small></span><span class="dt"></span>`;
      node.dataset.built = "1";
    }
    const level = String(entry.level || "info");
    changed = setAttr(node, "data-level", level) || changed;
    const ts = node.querySelector(".ts");
    const lv = node.querySelector(".lv");
    const [event, project] = node.querySelector(".ev-name").children;
    changed = setText(ts, fmtTime(entry.ts)) || changed;
    changed = setAttr(ts, "title", entry.ts || "") || changed;
    changed = setText(lv, level) || changed;
    lv.className = `lv ${level}`;
    changed = setText(event, entry.event || "—") || changed;
    changed = setText(project, entry.projectCode || "") || changed;
    project.hidden = !entry.projectCode;
    changed = setText(node.querySelector(".dt"), detailText(entry)) || changed;
    return changed;
  }

  function visible() {
    return state.entries.filter(matches);
  }

  function render() {
    const table = $("#logTable");
    const rows = visible();
    // Newest first, and only ever keep the newest 600 in the DOM.
    const ordered = [...rows].reverse();
    renderKeyed(table, ordered.slice(0, 600), renderRow, (entry) => String(entry.seq));
    $("#emptyState").hidden = rows.length > 0;
    table.hidden = rows.length === 0;
    if (state.follow) table.scrollTop = 0;
    setText($("#logMeta"), `${rows.length} 条${rows.length > 600 ? "（显示最新 600）" : ""} · 最新 seq ${state.lastSeq}`);
  }

  // The initial /api/logs page and the SSE backlog can overlap; seq is unique.
  const seen = new Set();
  function append(entries) {
    entries = entries.filter((entry) => {
      const key = String(entry.seq);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    if (!entries.length) return;
    state.entries = [...state.entries, ...entries].sort((a, b) => Number(a.seq) - Number(b.seq));
    if (state.entries.length > 4000) state.entries = state.entries.slice(-4000);
    state.lastSeq = Math.max(state.lastSeq, Number(entries[entries.length - 1].seq) || 0);
    render();
  }

  $("#levelRow").addEventListener("click", (event) => {
    const button = event.target.closest("[data-level]");
    if (!button) return;
    state.level = button.dataset.level;
    $$("#levelRow button").forEach((node) => node.classList.toggle("active", node === button));
    render();
  });
  $("#searchInput").addEventListener("input", debounce((event) => {
    state.query = event.target.value.trim().toLowerCase();
    render();
  }, 150));
  $("#followToggle").addEventListener("change", (event) => {
    state.follow = event.target.checked;
    if (state.follow) $("#logTable").scrollTop = 0;
  });
  // Scrolling down to read older entries pauses following; back at the top resumes it.
  $("#logTable").addEventListener("scroll", debounce(() => {
    const atTop = $("#logTable").scrollTop < 8;
    if (atTop !== state.follow) {
      state.follow = atTop;
      $("#followToggle").checked = atTop;
    }
  }, 120));
  $("#clearBtn").addEventListener("click", () => { state.entries = []; render(); });

  async function setMode(mode) {
    try {
      await postJson("/api/automation", { action: "set-schedule-mode", mode });
      toast(`调度模式已切换为 ${mode === "containers" ? "容器优先" : "任务数量优先"}`);
    } catch (error) {
      toast(`切换失败：${error.message}`, true);
    }
  }
  $("#modeBadge").addEventListener("click", async () => {
    const current = ((state.snapshot || {}).queue || {}).scheduleMode || "containers";
    await setMode(current === "containers" ? "tasks" : "containers");
  });
  $("#folderSelect").addEventListener("change", async (event) => {
    try {
      await postJson("/api/settings", { settings: { defaultFolderId: event.target.value } });
      toast("默认文件夹已更新");
    } catch (error) {
      toast(`保存失败：${error.message}`, true);
    }
  });

  function applySnapshot(payload) {
    state.snapshot = payload;
    renderRail({ ...payload, connected: state.connected, error: state.error });
  }

  connectStream({
    onSnapshot: applySnapshot,
    onTasks: (payload) => {
      if (!state.snapshot) return;
      if (payload.queue) state.snapshot.queue = payload.queue;
      if (payload.summary) state.snapshot.summary = payload.summary;
      if (payload.containers) state.snapshot.containers = payload.containers;
      renderRail({ ...state.snapshot, connected: state.connected, error: state.error });
    },
    onLog: (payload) => append(payload.entries || []),
    onStatus: ({ connected, error }) => {
      state.connected = connected;
      state.error = error;
      if (state.snapshot) renderRail({ ...state.snapshot, connected, error });
    },
  });

  fetchJson("/api/logs?limit=300").then((data) => {
    const entries = (data.entries && data.entries.length ? data.entries : data.recent) || [];
    append([...entries].reverse());
  }).catch((error) => toast(`读取日志失败：${error.message}`, true));
  fetchJson("/api/snapshot").then(applySnapshot).catch(() => {});
</script>
</body>
</html>
